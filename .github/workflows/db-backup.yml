name: Database backup

# Nightly pg_dump of the production database, kept as a private workflow
# artifact for 14 days. Requires a repository secret named DATABASE_URL
# (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check the secret is set
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Add a DATABASE_URL repository secret to enable backups."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install PostgreSQL client
        if: steps.check.outputs.enabled == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Dump database
        if: steps.check.outputs.enabled == 'true'
        run: |
          file="waretrack-$(date -u +%Y-%m-%d).sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "$file"
          ls -lh "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          name: database-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14
