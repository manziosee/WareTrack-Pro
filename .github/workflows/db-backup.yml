name: Database backup

# Nightly pg_dump of the production database, kept as a private workflow
# artifact for 14 days. Requires a repository secret named DATABASE_URL
# (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    services:
      restore-db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: restore-only
          POSTGRES_DB: waretrack_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d waretrack_restore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESTORE_URL: postgresql://postgres:restore-only@localhost:5432/waretrack_restore
    steps:
      - name: Check the secret is set
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Add a DATABASE_URL repository secret to enable backups."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install PostgreSQL client
        if: steps.check.outputs.enabled == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Dump database
        if: steps.check.outputs.enabled == 'true'
        run: |
          file="waretrack-$(date -u +%Y-%m-%d).sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "$file"
          ls -lh "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
      - name: Restore backup into isolated PostgreSQL and verify core tables
        if: steps.check.outputs.enabled == 'true'
        run: |
          gunzip -c "$BACKUP_FILE" | psql "$RESTORE_URL" --set ON_ERROR_STOP=1 --quiet
          psql "$RESTORE_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.users') IS NULL
              OR to_regclass('public.inventory_items') IS NULL
              OR to_regclass('public.delivery_orders') IS NULL THEN
              RAISE EXCEPTION 'Restored backup is missing one or more core WareTrack tables';
            END IF;
            IF (SELECT COUNT(*) FROM users) < 1 THEN
              RAISE EXCEPTION 'Restored backup contains no user records';
            END IF;
          END $$;
          SELECT 'Backup restore verification passed';
          SQL
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          name: database-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14
