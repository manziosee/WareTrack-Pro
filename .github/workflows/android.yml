name: Android driver app

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: https://waretrack-pro.onrender.com/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Build the web app into the Android project
        run: npm run android:sync
      - name: Build the APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK after this build
        run: mv android/app/build/outputs/apk/debug/app-debug.apk "waretrack-driver-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: waretrack-driver-apk
          path: frontend/waretrack-driver-*.apk
          retention-days: 30
