name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waretrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waretrack_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: grep -q '^FROM node:24-alpine' Dockerfile
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx tsc --noEmit -p .
      - run: npm run build
      # Company data separation and business-flow tests against a real database
      - run: npx prisma db push --skip-generate
      - run: npx jest --runInBand

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: grep -q '^FROM node:24-alpine' Dockerfile && grep -q '^FROM node:24-alpine' Dockerfile.prod
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  e2e:
    name: Browser tests (order to cash, stock count, packing, trips, pricing)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waretrack_e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waretrack_e2e_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      PORT: '5056'
      FRONTEND_URL: http://localhost:3002
      LOGIN_RATE_LIMIT_PER_15_MIN: '1000'
      OSRM_URL: 'off'
      E2E_BASE_URL: http://localhost:3002
      E2E_API_URL: http://localhost:5056/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start the API on a seeded test database
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npx prisma generate
          npx prisma db push --skip-generate
          npx ts-node --transpile-only -O '{"module":"commonjs"}' prisma/e2e-seed.ts
          npm run build
          nohup node dist/server.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5056/health && break; sleep 1; done
      - name: Build and serve the app
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5056/api
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
          nohup npx vite preview --port 3002 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3002 >/dev/null && break; sleep 1; done
      - name: Run Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/api.log
          retention-days: 7
