app = "waretrack-pro-api"
primary_region = "iad"

[build]
  [build.args]
    NODE_ENV = "production"

[env]
  NODE_ENV = "production"
  PORT = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[deploy]
  # release_command = "npx prisma migrate deploy && npx prisma generate"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512